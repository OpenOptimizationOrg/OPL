rw_cmop:
  type: suite
  name: RCM / RWCMOP
  long_name: Real-world constrained multi-objective optimization problems
  variables: # For each variable type, enter the number of variables of that type, or a range by specifiying min and/or max
    total: [2,...,34]  # Options for numbers of this variable type (here, the suite has problems with either 0 or 5 categorical variables)
  objectives:
  - 2
  - 5
  constraints: #constraints refers to hard constrains (violations don't have a true fitness value)
  #Similar to variables, specify for each type of constraints the number, list, or a range. 
    box: 1
  soft_constraints: 
    linear: 
      max: 5
    function: [5, 10]
  allows_partial_evaluation: yes / no / some #Whether evaluation of subset(s) of decision variables are possible
  can_evaluate_objectives_independently: yes / no / some # Can objective functions be evaluated independently of each other yes, no or some
  code_examples: null #Link to a code example in the OPL repository
  description: 'A Benchmark-Suite of real-World constrained multi-objective optimization problems. Includes problems with 0-29 inequality constraints, 0-26 euqality constraints, including some with both types.'
  dynamic_type:
    - None
  fidelity_levels: 1
  modality: Unknown
  noise_type:
    - None
  references:
    - https://doi.org/10.1016/j.swevo.2021.100961
  source: 'real-world'
  tags:
    - "inequality constraints"
    - "equality constraints"
  problems:
    - rcm2
    - rcm3
    - rcm4
    - rcm5
    - rcm10
    - rcm11
    - rcm12
    - rcm14
    - rcm16
    - rcm18
    - rcm20
  implementations:
  - rw_cmop_suganthan

rw_cmop_suganthan:
  type: implementation
  name: RCM / RWCMOP
  description:
  link:
  - type: GitHub
    url: 'https://github.com/P-N-Suganthan/2021-RW-MOP'
  language: Matlab

