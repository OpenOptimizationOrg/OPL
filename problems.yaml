impl_vae_molecule_generation:
  description: 'The goal of drug and material design is to identify novel molecules
    that have certain desirable properties. We view this as an optimization problem,
    in which we are searching for the molecules that maximize our quantitative desiderata.


    Making and testing new compounds are costly and time-consuming, and the number
    of potential candidates is overwhelming. Only about 10^8 substances have ever
    been synthesized, whereas the range of potential drug-like molecules is estimated
    to be between 10^23 and 10^60. Virtual screening can be used to speed up this
    search. Virtual libraries containing thousands to hundreds of millions of candidates
    can be assayed with first-principles simulations or statistical predictions based
    on learned proxy models, and only

    the most promising leads are selected and tested experimentally.


    Ways to assess the generated molecules are the water−octanol partition coefficient
    (logP), the synthetic accessibility score (SAS), and Quantitative Estimation of
    Drug-likeness (QED), which ranges in value between 0 and 1, with higher values
    indicating that the molecule is more drug-like.'
  evaluation_time: null
  language: Python
  links:
  - type: repository
    url: https://github.com/Ryan-Rhys/Constrained-Bayesian-Optimisation-for-Automatic-Chemical-Design
  name: VAE Molecule Generation
  requirements: null
  type: implementation
