impl_optimization_of_a_spoiler_ice_airfoil_model:
  description: 'When operating in cold climate, the performance of the wind turbines
    can be reduced by icing. In an extreme condition, heavy icing can even lead to
    a complete stop of the turbine. Icing is also a risky condition for airplane wings
    since it may induce flow separation at a small angles of attack, which then might
    lead to stall and consequently loss of lift. Ice accretion is a complex process
    which depends on both aerodynamics and thermodynamics. The process is affected
    by many parameters, for instance, ambient temperature, surface properties, relative
    speed of the airfoil, and the time span over which the icing event takes place.
    As a result, numerous possibilities for an ice profile exist. Bragg et al. categorized
    the leading-edge ice on the airfoils into four types: roughness, horn, streamwise,
    and spanwise-ridge ice. The main characteristic of the horn ice is the presence
    of the large protuberances which induce a large flow separation downstream of
    the ice, and hence dramatically affect the aerodynamic performance, including
    the lift, drag and moment coefficients. On the other hand, streamwise ice is smoothly
    formed along the streamlines and is less dangerous in the sense of having adverse
    effects on the aerodynamic performance.'
  evaluation_time:
  - The authors disclose it takes 1 hour.
  language: Besides Python (as the authors use GPy) for optimizing the problem, there
    is the need of a commercial mesher (ANSYS ICEM)
  links: null
  name: Optimization of a spoiler-ice airfoil model
  requirements: null
  type: implementation
impl_optimization_of_milireactor:
  description: Polymerization processes in the (specialty) chemical industry increasingly
    rely on continuous flow processing. Continuous polymerization reactors are promising,
    because their large surface to volume ratio allows for faster heat removal and
    better temperature control than batch reactors. Furthermore, this ratio can be
    kept constant during scaleup, reducing the need for pilot stages making it easier
    to go from lab- to production scale. However, continuous polymerization reactors,
    especially milli-scale reactors with internal mixing elements, can be highly complex
    devices, which can be difficult to characterize experimentally, as many of their
    properties are not readily available via measurements. Additionally, their small
    size renders them especially prone to fouling
  evaluation_time:
  - 6.6 hours
  language: COMSOL (It's suspected the authors used MATLAB)
  links: null
  name: Optimization of milireactor
  requirements: null
  type: implementation
