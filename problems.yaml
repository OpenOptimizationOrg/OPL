  allows_partial_evaluation: 'no'
  can_evaluate_objectives_independently: null
  code_examples: null
  constraints:
  - equality: null
    hard: 'yes'
    number: 1
    type: box
  - equality: null
    hard: 'yes'
    number: 1
    type: unknown
  description: A beam, simply supported at both ends, is struck laterally by a rigid
    pole, mimicking side-pole crash tests. The objective is to minimize intrusion,
    defined as the maximal dynamic displacement of the impactor before rebound, subject
    to a volume constraint of at most 50% of the design domain. The design is parameterized
    by a level-set function with 15 variables, mapped onto an LS-Dyna mesh of 1,600
    eight-node solid elements with piecewise linear plasticity. Void elements are
    deleted from the mesh, and the out-of-plane (z) direction is fixed.
  dynamic_type:
  - none
  evaluation_time:
  - 2 minutes
