    U0 in the positive horizontal direction, x. The aim is to optimize the shape of
    the left and right walls so that the energy dissipation is either minimized or
    maximized with the constraint of keeping the total volume of the fluid confined
    in the cavity fixed and also retain the length and position of the upper and lower
    walls. Therefore, the objective is to find the wall shape which either minimizes
