suite_guacamol:
  allows_partial_evaluation: unknown
  can_evaluate_objectives_independently: null
  code_examples: null
  constraints:
  - equality: null
    hard: 'yes'
    number: null
    type: unknown
  description: 'De novo molecular design is a computational technique to generate
    novel compounds with desirable property profiles from scratch. It complements
    virtual screening, where large virtual compound libraries are pregenerated, stored,
    and then subsequently ranked on demand. Virtual screening is particularly useful
    when the virtual compounds are readily available (commercially, or in in-house
    screening collections), or easy to synthesize. Data sets sized on the order of
    10^13 can be routinely screened under current computational constraints. However,
    this is only a tiny fraction of drug-like chemical space, which has an estimated
    size anywhere between 10^24 and 10^60 possible structures. This number might be
    even larger considering new modalities such as PROTACs. Efficient approaches to
    query larger combinatorial spaces without full enumeration via similarity to given
    structures have been reported. However, it is not straightforward to perform more
    complex, multiobjective queries without enumerating substantial parts of the space.


    In contrast, in de novo design, only a relatively small number of molecules is
    explicitly generated, and chemical space is explored via search or optimization
    procedures. Thus, by focusing on the most relevant areas of chemical space for
    the current multiobjective query, de novo design algorithms can in principle explore
    the full chemical space, given any ranking or scoring function.'
  dynamic_type:
  - none
  evaluation_time: null
  fidelity_levels:
  - 1
  - 2
  implementations:
  - impl_guacamol
  long_name: 'GuacaMol: Benchmarking Models for de Novo Molecular Design'
