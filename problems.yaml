fn_optimization_of_milireactor:
  allows_partial_evaluation: 'no'
  can_evaluate_objectives_independently: 'no'
  code_examples: null
  constraints: []
  description: Polymerization processes in the (specialty) chemical industry increasingly
    rely on continuous flow processing. Continuous polymerization reactors are promising,
    because their large surface to volume ratio allows for faster heat removal and
    better temperature control than batch reactors. Furthermore, this ratio can be
    kept constant during scaleup, reducing the need for pilot stages making it easier
    to go from lab- to production scale. However, continuous polymerization reactors,
    especially milli-scale reactors with internal mixing elements, can be highly complex
    devices, which can be difficult to characterize experimentally, as many of their
    properties are not readily available via measurements. Additionally, their small
    size renders them especially prone to fouling
  dynamic_type:
  - none
  evaluation_time:
  - 6.6 hours
  fidelity_levels: null
  implementations:
