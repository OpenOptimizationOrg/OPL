name: Validate problems.yaml

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install the project
        run: uv sync

      - name: Validate problems.yaml against the schema
        run: uv run opl validate problems.yaml
