name: New Problem Check

on:
  workflow_dispatch: # allow triggering workflow manually
    inputs:
      reason:
        description: "Reason for Running"
        required: false
        default: "Manually trigger problem check"

jobs:
  check_new_problems:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run New Problem Check
        run: uv run utils/validate_yaml.py problems.yaml
